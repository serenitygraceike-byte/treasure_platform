services:
  postgres:
    image: postgres:17-alpine
    container_name: treasury-postgres
    restart: unless-stopped
    env_file: ../../.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - treasury_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [internal]
    mem_limit: 512m
    # No published port — reachable only from the internal network.

  # docs/02-LEDGER-SPEC.md: financial core, its own Postgres, isolated from
  # the app database. No published port — only `web` reaches it, over the
  # internal network.
  formance-postgres:
    image: postgres:16-alpine
    container_name: treasury-formance-postgres
    restart: unless-stopped
    env_file: ../../.env
    environment:
      POSTGRES_USER: ${FORMANCE_POSTGRES_USER}
      POSTGRES_PASSWORD: ${FORMANCE_POSTGRES_PASSWORD}
      POSTGRES_DB: ${FORMANCE_POSTGRES_DB}
    volumes:
      - treasury_formance_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${FORMANCE_POSTGRES_USER} -d ${FORMANCE_POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [internal]
    mem_limit: 384m

  # docs/04-DEPLOYMENT-SPEC.md Model B: plain Docker, not the officially
  # "supported" Kubernetes-operator production path — a deliberate,
  # documented risk acceptance for this MVP's traffic/budget, not an
  # accident (see infrastructure/production/README.md).
  formance-ledger:
    image: ghcr.io/formancehq/ledger:v2.4.12
    container_name: treasury-formance-ledger
    restart: unless-stopped
    environment:
      DEBUG: "false"
      POSTGRES_URI: postgresql://${FORMANCE_POSTGRES_USER}:${FORMANCE_POSTGRES_PASSWORD}@formance-postgres/${FORMANCE_POSTGRES_DB}?sslmode=disable
      AUTO_UPGRADE: "true"
    env_file: ../../.env
    depends_on:
      formance-postgres:
        condition: service_healthy
    networks: [internal]
    mem_limit: 384m
    # No published port — reachable only as http://formance-ledger:3068
    # from the internal network (web's FORMANCE_BASE_URL in .env).

  web:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: treasury-web
    restart: unless-stopped
    env_file: ../../.env
    depends_on:
      postgres:
        condition: service_healthy
      formance-ledger:
        condition: service_started
    networks: [internal]
    mem_limit: 512m
    # No published port — Caddy is the only public entry point.

  # One-off migration/seed runner — uses the `builder` stage, which still
  # has the Prisma CLI and tsx (devDependencies the slim `web` image drops).
  # Not started by `up`; run explicitly: `docker compose run --rm migrate`.
  migrate:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: builder
    command: sh -c "npx prisma migrate deploy && npx prisma db seed"
    env_file: ../../.env
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]
    profiles: ["tools"]

  caddy:
    image: caddy:2-alpine
    container_name: treasury-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web]
    networks: [internal]
    mem_limit: 128m

networks:
  internal:
    driver: bridge

volumes:
  treasury_pgdata:
  treasury_formance_pgdata:
  caddy_data:
  caddy_config:
