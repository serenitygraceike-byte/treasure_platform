name: CI

# Phase 0 scope only: install, typecheck, lint, unit tests, build.
# Integration tests (need a live Postgres + Formance) and deploy stages are
# added in later phases per docs/05-MVP-ROADMAP.md — not invented here.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm exec prisma generate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm run build
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          BETTER_AUTH_SECRET: ci_only_not_for_production_00000000000000
          BETTER_AUTH_URL: http://localhost:3000
