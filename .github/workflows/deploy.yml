name: Deploy

# docs/04-DEPLOYMENT-SPEC.md's CI/CD list ends "deploy staging, manual
# production approval". This repo only has one environment (production,
# wau.digital) — no separate staging VPS exists yet — so the manual-
# approval step is done with a GitHub Environment ("production") that
# has required reviewers configured in repo settings. Add that reviewer
# rule before relying on this workflow; without it, this deploys on
# every successful push to main with no human gate at all.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    steps:
      # TEMPORARY diagnostic step — prints only the key's fingerprint,
      # never the key itself, to confirm DEPLOY_SSH_KEY reached this job
      # intact. Compare against `ssh-keygen -lf ~/.ssh/gha_deploy.pub` on
      # the VPS (expected: SHA256:MiOtXX3JD+au5hsuM8LUjIofDTnndVJNgCznilUI+K4).
      # Remove this step once auth is confirmed working.
      - name: Debug -- fingerprint the received deploy key
        run: |
          echo "host is set: $([ -n "${{ secrets.DEPLOY_HOST }}" ] && echo yes || echo no)"
          echo "username length: $(printf '%s' "${{ secrets.DEPLOY_USER }}" | wc -c)"
          echo "username bytes (octal, catches hidden whitespace):"
          printf '%s' "${{ secrets.DEPLOY_USER }}" | od -c | head -3
          echo "key line count: $(printf '%s' "${{ secrets.DEPLOY_SSH_KEY }}" | wc -l)"
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > /tmp/k
          chmod 600 /tmp/k
          ssh-keygen -lf /tmp/k || echo "ssh-keygen could not parse the key -- it is malformed"
          echo "--- raw ssh test (bypassing appleboy/ssh-action) ---"
          ssh -vvv -o StrictHostKeyChecking=no -o BatchMode=yes -o ConnectTimeout=10 \
            -i /tmp/k "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            echo RAW_SSH_OK 2>&1 | tail -40
          rm -f /tmp/k

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd /opt/treasury-platform
            git fetch origin main
            git reset --hard origin/main
            cd infrastructure/production
            docker compose --env-file ../../.env build migrate web
            docker compose --env-file ../../.env run --rm migrate
            docker compose --env-file ../../.env up -d web
